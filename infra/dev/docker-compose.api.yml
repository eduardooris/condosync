# CondoSync — DEV API stack (NestJS backend)
#
# Build local a partir de ./backend. Restart/rebuild deste arquivo NÃO toca em
# postgres/redis/keycloak/minio nem no message-server.
#
# Uso isolado (rebuild só da API):
#   docker compose -f infra/dev/docker-compose.api.yml up -d --build
#
# Uso integrado:
#   docker compose up -d           # via include: no docker-compose.yml raiz
#
# Pré-requisito: o stack `deps` deve estar de pé (rede condosync_dev existe e
# os serviços postgres/redis/keycloak/minio estão healthy).

services:
  api:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: condosync-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    # Fonte única de configuração: backend/.env (copiado de .env.example
    # na 1ª subida). Tudo que NÃO precisa de override docker-specific deve
    # viver lá — não duplicar aqui.
    env_file:
      - path: ../../backend/.env
        required: false
    environment:
      # ── overrides obrigatórios para rodar dentro da rede docker ───────
      # Estes substituem os equivalentes em backend/.env (que usam
      # localhost — bom pra `npm run start:dev` no host).
      NODE_ENV: development
      SKIP_MIGRATIONS: "1"
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/condosync
      REDIS_URL: redis://redis:6379
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080/realms/main
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-http://localhost:8080/realms/main}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      MESSAGE_SERVER_BASE_URL: http://message-server:8080
    networks:
      - condosync_dev

networks:
  condosync_dev:
    name: condosync_dev
    driver: bridge
