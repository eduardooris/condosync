# CondoSync — API (build local na VPS; sem pull do GHCR)
#
#   cd infra
#   docker compose -f docker-compose.prod.yml -f docker-compose.api.yml \
#     -f docker-compose.build.yml --env-file .env.prod up -d --build

services:
  api:
    image: condosync-api:local
    pull_policy: never
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: condosync-api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      AUTH_PROVIDER: keycloak
      # Defaults atendem DNS+TLS. Modo IP-only sobrescreve via .env.prod
      # (KEYCLOAK_BASE_URL com /auth, KEYCLOAK_ISSUER baseado em APP_PUBLIC_URL).
      KEYCLOAK_BASE_URL: ${KEYCLOAK_BASE_URL:-http://keycloak:8080}
      KEYCLOAK_REALM: main
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-https://${AUTH_DOMAIN}/realms/main}
      # Token + JWKS via URL pública (nginx + TLS). Não use http://keycloak:8080 aqui — o JWT
      # viria com iss http:// e quebra o login (iss ≠ KEYCLOAK_ISSUER https).
      KEYCLOAK_INTERNAL_URL: ${KEYCLOAK_INTERNAL_URL:-https://${AUTH_DOMAIN}/realms/main}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:-condo-backend-admin}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-https://${APP_DOMAIN}}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      CORS_ORIGINS: ${CORS_ORIGINS:-https://${APP_DOMAIN}}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-s3}
      STORAGE_BUCKET: ${STORAGE_BUCKET}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      MESSAGE_SERVER_BASE_URL: ${MESSAGE_SERVER_BASE_URL:-http://message-server:8080}
      MESSAGE_SERVER_API_KEY: ${MESSAGE_SERVER_API_KEY:-}
      MESSAGE_SERVER_TIMEOUT_MS: ${MESSAGE_SERVER_TIMEOUT_MS:-10000}
      MESSAGE_SERVER_COMPANY_ID: ${MESSAGE_SERVER_COMPANY_ID:-condosync}
      MESSAGE_SERVER_INSTANCE_NAME: ${MESSAGE_SERVER_INSTANCE_NAME:-CondoSync}
      MESSAGE_SERVER_INSTANCE_ID: ${MESSAGE_SERVER_INSTANCE_ID:-}
      MESSAGE_SERVER_WEBHOOK_SECRET: ${MESSAGE_SERVER_WEBHOOK_SECRET:-}
      THROTTLE_TTL: ${THROTTLE_TTL:-60}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-360}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-https://${APP_DOMAIN}}
      INTERCOM_GUEST_JWT_SECRET: ${INTERCOM_GUEST_JWT_SECRET:-}
      INTERCOM_GUEST_JWT_TTL_SEC: ${INTERCOM_GUEST_JWT_TTL_SEC:-900}
      INTERCOM_RING_TIMEOUT_SEC: ${INTERCOM_RING_TIMEOUT_SEC:-45}
      WEBRTC_STUN_URLS: ${WEBRTC_STUN_URLS:-stun:stun.l.google.com:19302}
      WEBRTC_TURN_URL: ${WEBRTC_TURN_URL:-}
      WEBRTC_TURN_USERNAME: ${WEBRTC_TURN_USERNAME:-}
      WEBRTC_TURN_CREDENTIAL: ${WEBRTC_TURN_CREDENTIAL:-}
      ASAAS_ENV: ${ASAAS_ENV:-production}
      ASAAS_API_BASE_URL: ${ASAAS_API_BASE_URL:-https://api.asaas.com/v3}
      ASAAS_MASTER_API_KEY: ${ASAAS_MASTER_API_KEY:-}
      ASAAS_SAAS_WALLET_ID: ${ASAAS_SAAS_WALLET_ID:-}
      ASAAS_WEBHOOK_PUBLIC_BASE_URL: ${ASAAS_WEBHOOK_PUBLIC_BASE_URL:-${APP_PUBLIC_URL:-https://${APP_DOMAIN}}}
      ASAAS_ACCOUNTS_ENABLED: ${ASAAS_ACCOUNTS_ENABLED:-false}
      ASAAS_ALLOW_SANDBOX_IN_PROD: ${ASAAS_ALLOW_SANDBOX_IN_PROD:-false}
      ASAAS_DEFAULT_SPLIT_PERCENT: ${ASAAS_DEFAULT_SPLIT_PERCENT:-0}
      ASAAS_REQUEST_TIMEOUT_MS: ${ASAAS_REQUEST_TIMEOUT_MS:-15000}
      ASAAS_RETRY_MAX: ${ASAAS_RETRY_MAX:-3}
      PAYMENTS_ENCRYPTION_KEY: ${PAYMENTS_ENCRYPTION_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
      message-server:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/v1/health/ready"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 30s
    networks:
      - edge
      - core
      - messaging

networks:
  edge:
    external: false
  core:
    external: false
  messaging:
    external: false
