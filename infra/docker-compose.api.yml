# CondoSync — Override do serviço `api`
#
#   cd infra
#   docker compose -f docker-compose.prod.yml -f docker-compose.api.yml \
#     --env-file ../.env up -d --no-deps api
#
# • `../.env` (raiz) → senhas postgres/redis/keycloak no compose
# • `../backend/.env` → toda config da API Nest

services:
  api:
    image: ${API_IMAGE:-ghcr.io/condosync/condosync-api}:${IMAGE_TAG:-latest}
    container_name: condosync-api
    restart: always
    pull_policy: always
    env_file:
      - path: ../backend/.env
        required: true
    environment:
      NODE_ENV: production
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080/realms/main
      MESSAGE_SERVER_BASE_URL: http://message-server:8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
      message-server:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/v1/health/ready"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 30s
    networks:
      - edge
      - core
      - messaging

networks:
  edge:
    external: false
  core:
    external: false
  messaging:
    external: false
