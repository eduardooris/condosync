# ─────────────────────────────────────────────────────────────────────────────
# CondoSync — Nginx Reverse Proxy (Produção)
#
# Substitua APP_DOMAIN e AUTH_DOMAIN pelos seus domínios reais.
# Para ativar SSL rode primeiro: infra/scripts/init-ssl.sh
#
# Após emitir os certificados, descomente os blocos HTTPS abaixo
# e comente/remova os blocos HTTP simples.
# ─────────────────────────────────────────────────────────────────────────────

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile    on;
  tcp_nopush  on;
  tcp_nodelay on;

  keepalive_timeout 65;
  client_max_body_size 50m;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

  # Logs
  access_log /var/log/nginx/access.log;
  error_log  /var/log/nginx/error.log warn;

  # ── Upstreams ──────────────────────────────────────────────────────────────
  upstream api_backend {
    server api:3000;
    keepalive 32;
  }

  upstream frontend_app {
    server frontend:80;
    keepalive 16;
  }

  upstream keycloak_server {
    server keycloak:8080;
    keepalive 16;
  }

  # ── HTTP → HTTPS redirect (ativar quando SSL estiver configurado) ──────────
  # server {
  #   listen 80;
  #   server_name APP_DOMAIN AUTH_DOMAIN;
  #
  #   location /.well-known/acme-challenge/ {
  #     root /var/www/certbot;
  #   }
  #
  #   location / {
  #     return 301 https://$host$request_uri;
  #   }
  # }

  # ── App — HTTP (temporário, antes de configurar SSL) ──────────────────────
  server {
    listen 80;
    server_name APP_DOMAIN;   # ex: app.condosync.com.br

    # Let's Encrypt challenge (necessário para emitir certificado)
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    # API proxy — preserva o prefixo /api (NestJS usa globalPrefix 'api')
    location /api {
      proxy_pass         http://api_backend;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   Upgrade           $http_upgrade;
      proxy_set_header   Connection        "upgrade";
      proxy_read_timeout 120s;
    }

    # Frontend SPA — tudo o que não for /api vai pro React
    location / {
      proxy_pass         http://frontend_app;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }
  }

  # ── Auth (Keycloak) — HTTP (temporário) ───────────────────────────────────
  server {
    listen 80;
    server_name AUTH_DOMAIN;   # ex: auth.condosync.com.br

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      proxy_pass         http://keycloak_server;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      # Buffer maior para respostas do Keycloak (tokens, JWKS, etc.)
      proxy_buffer_size        16k;
      proxy_buffers            8 16k;
      proxy_busy_buffers_size  32k;
    }
  }

  # ─── HTTPS — descomente e substitua domínios após rodar init-ssl.sh ────────
