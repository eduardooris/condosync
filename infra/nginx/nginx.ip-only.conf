# ─────────────────────────────────────────────────────────────────────────────
# CondoSync — Nginx (modo IP-only / SEM DNS / SEM TLS)
#
# Único server block, catch-all (server_name _), HTTP puro na :80.
# Roteamento por path:
#   /api/*  → backend NestJS
#   /auth/* → Keycloak (que precisa rodar com KC_HTTP_RELATIVE_PATH=/auth)
#   /       → frontend SPA
#
# Use junto com infra/docker-compose.ip-only.yml. Quando comprar o DNS,
# volte a usar nginx.conf + init-ssl.sh.
# ─────────────────────────────────────────────────────────────────────────────

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile    on;
  tcp_nopush  on;
  tcp_nodelay on;

  keepalive_timeout 65;
  client_max_body_size 50m;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

  access_log /var/log/nginx/access.log;
  error_log  /var/log/nginx/error.log warn;

  upstream api_backend {
    server api:3000;
    keepalive 32;
  }

  upstream frontend_app {
    server frontend:80;
    keepalive 16;
  }

  upstream keycloak_server {
    server keycloak:8080;
    keepalive 16;
  }

  server {
    listen 80 default_server;
    server_name _;

    # API NestJS — preserva /api (globalPrefix do Nest)
    location /api {
      proxy_pass         http://api_backend;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   Upgrade           $http_upgrade;
      proxy_set_header   Connection        "upgrade";
      proxy_read_timeout 120s;
    }

    # Keycloak — sob /auth (precisa de KC_HTTP_RELATIVE_PATH=/auth no compose)
    location /auth {
      proxy_pass         http://keycloak_server;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_buffer_size        16k;
      proxy_buffers            8 16k;
      proxy_busy_buffers_size  32k;
    }

    # Frontend SPA — fallback
    location / {
      proxy_pass         http://frontend_app;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }
  }
}
