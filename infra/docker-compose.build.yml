# CondoSync — build local na VPS (sem GHCR / sem GitHub Actions)
#
#   cd infra
#   docker compose -f docker-compose.prod.yml \
#     -f docker-compose.api.yml \
#     -f docker-compose.build.yml \
#     --env-file .env.prod up -d --build
#
# Ou: ../scripts/vps-up.sh

services:
  frontend:
    image: condosync-frontend:local
    pull_policy: never
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${APP_PUBLIC_URL:-https://${APP_DOMAIN}}
        VITE_KEYCLOAK_URL: https://${AUTH_DOMAIN}
        VITE_KEYCLOAK_REALM: main
        VITE_KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-main-frontend}

  message-server:
    image: condosync-message-server:local
    pull_policy: never
    build:
      context: ../message-server-main
      dockerfile: Dockerfile
