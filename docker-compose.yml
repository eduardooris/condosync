# CondoSync — API + Message Server + Postgres + Redis + Keycloak + MinIO (S3 local)
# Uso:
#   1) cp backend/.env.example backend/.env
#   2) docker compose up --build
#   3) http://localhost:3000/api/health  |  Swagger: http://localhost:3000/api/docs
#   4) Keycloak admin: http://localhost:8080 (admin / admin)
#   5) MinIO console:  http://localhost:9001 (minioadmin / minioadmin)
#
# O banco, o Redis e o MinIO abaixo substituem localhost no container
# (DATABASE_URL / REDIS_URL / S3_ENDPOINT). A autenticação padrão é Keycloak
# (JWT via realm main). O Postgres local guarda as tabelas do app
# (TypeORM sync em development). MinIO provê storage S3-compatible em dev.
# O message-server roda no compose e publica webhook para a API.

services:
  postgres:
    image: postgres:16-alpine
    container_name: condosync-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: condosync
    ports:
      - "5432:5432"
    volumes:
      - condosync_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d condosync"]
      interval: 5s
      timeout: 5s
      retries: 8

  keycloak-db:
    image: postgres:16-alpine
    container_name: condosync-keycloak-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
      POSTGRES_DB: keycloak
    volumes:
      - condosync_keycloak_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 8

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: condosync-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HEALTH_ENABLED: "true"
      # Hostname v2 (Keycloak >= 24). Garante que o `iss` estampado nos JWTs
      # seja SEMPRE `http://localhost:8080/realms/main`, independente da
      # request ter chegado pelo browser (localhost) ou pelo backend via
      # DNS interno (`keycloak:8080`). Isso é o que faz o `verifyAccessToken`
      # do backend bater (ele compara `iss` com KEYCLOAK_ISSUER).
      #
      # Obs.: as antigas KC_HOSTNAME_URL/KC_HOSTNAME_ADMIN_URL são da v1 e
      # ficam silenciosamente IGNORADAS no KC 25 — não use.
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: forwarded
    ports:
      - "8080:8080"
    volumes:
      - ./infra/keycloak/realm-main.json:/opt/keycloak/data/import/realm-main.json:ro
    depends_on:
      keycloak-db:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: condosync-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: condosync-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Console web
    volumes:
      - condosync_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Cria automaticamente o bucket `condosync-files` no MinIO na primeira subida.
  # `mc` (MinIO client) roda uma vez, garante o bucket e sai (run-once).
  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    container_name: condosync-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/condosync-files &&
      mc anonymous set none local/condosync-files &&
      echo 'Bucket condosync-files OK' &&
      exit 0
      "
    restart: "no"

  message-server:
    build:
      context: ./message-server-main
      dockerfile: Dockerfile
    container_name: condosync-message-server
    restart: unless-stopped
    ports:
      # 8080 já é do Keycloak. Publicamos o message-server em 8081 no host.
      - "8081:8080"
    environment:
      APP_ENV: local
      APP_NAME: message-server
      LOG_LEVEL: info
      HTTP_PORT: 8080
      HTTP_API_KEY: ${MESSAGE_SERVER_API_KEY:-}
      SHUTDOWN_TIMEOUT: 15s
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: condosync
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_SSLMODE: disable
      DB_MAX_CONNS: 10
      TRANSPORT_MODE: http
      WEBHOOK_URL: http://api:3000/api/v1/integrations/message-server/events
      WEBHOOK_AUTH_TOKEN: ${MESSAGE_SERVER_API_KEY:-}
      WEBHOOK_SECRET: ${MESSAGE_SERVER_WEBHOOK_SECRET:-}
      WEBHOOK_TIMEOUT: 10s
      OUTBOX_BATCH_SIZE: 100
      OUTBOX_POLL_INTERVAL: 500ms
      WHATSMEOW_LOG_LEVEL: INFO
      WHATSMEOW_DB_SCHEMA: whatsmeow
      METRICS_PORT: 9090
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
      OTEL_SERVICE_NAME: message-server
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: condosync-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      NODE_ENV: development
      # Em dev o schema base é criado via TypeORM synchronize; as migrations
      # atuais são "delta" e assumem tabelas já existentes.
      SKIP_MIGRATIONS: "1"
      PORT: 3000
      AUTH_PROVIDER: keycloak
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_REALM: main
      # Issuer público (mesmo URL que o frontend usa). É o que vem dentro do JWT.
      KEYCLOAK_ISSUER: http://localhost:8080/realms/main
      # URL interna (rede docker) usada pelo backend p/ falar com o Keycloak.
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080/realms/main
      KEYCLOAK_CLIENT_ID: main-frontend
      KEYCLOAK_ADMIN_CLIENT_ID: condo-backend-admin
      KEYCLOAK_ADMIN_CLIENT_SECRET: condo-backend-admin-dev-secret
      APP_PUBLIC_URL: http://localhost:5173
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/condosync
      REDIS_URL: redis://redis:6379
      # Storage S3 via MinIO local. Backend usa endpoint interno; URLs assinadas
      # usam endpoint público para que o browser fora do docker consiga baixar.
      STORAGE_PROVIDER: s3
      STORAGE_BUCKET: condosync-files
      S3_REGION: us-east-1
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_FORCE_PATH_STYLE: "true"
      MESSAGE_SERVER_BASE_URL: http://message-server:8080
      MESSAGE_SERVER_API_KEY: ${MESSAGE_SERVER_API_KEY:-}
      MESSAGE_SERVER_TIMEOUT_MS: ${MESSAGE_SERVER_TIMEOUT_MS:-10000}
      MESSAGE_SERVER_COMPANY_ID: ${MESSAGE_SERVER_COMPANY_ID:-condosync}
      MESSAGE_SERVER_INSTANCE_NAME: ${MESSAGE_SERVER_INSTANCE_NAME:-CondoSync}
      MESSAGE_SERVER_INSTANCE_ID: ${MESSAGE_SERVER_INSTANCE_ID:-}
      MESSAGE_SERVER_WEBHOOK_SECRET: ${MESSAGE_SERVER_WEBHOOK_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
      minio:
        condition: service_healthy

volumes:
  condosync_pgdata:
  condosync_keycloak_pgdata:
  condosync_minio_data:
