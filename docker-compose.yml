# CondoSync — Wrapper de desenvolvimento
#
# Este arquivo apenas inclui os 3 composes modulares em `infra/dev/`. Mantém
# a UX antiga de `docker compose up` no root do repositório, mas cada serviço
# tem seu ciclo de vida isolado.
#
# Equivalências:
#   docker compose up -d                                    → sobe tudo (deps + api + message-server)
#   docker compose -f infra/dev/docker-compose.deps.yml up -d            → só deps
#   docker compose -f infra/dev/docker-compose.api.yml up -d --build     → rebuild só da API
#   docker compose -f infra/dev/docker-compose.message-server.yml up -d --build → rebuild só do MS
#
# Atalho equivalente:
#   ./scripts/dev.sh up        # sobe tudo
#   ./scripts/dev.sh deps      # só deps
#   ./scripts/dev.sh api       # rebuild só da API
#   ./scripts/dev.sh msg       # rebuild só do message-server
#   ./scripts/dev.sh down      # derruba tudo (volumes preservados)
#
# Acesso (depois do `up -d`):
#   http://localhost:3000/api/health   |  Swagger: http://localhost:3000/api/docs
#   http://localhost:8080              (Keycloak admin: admin / admin)
#   http://localhost:9001              (MinIO console: minioadmin / minioadmin)
#
# Pré-requisito: `cp backend/.env.example backend/.env` antes da primeira subida.

include:
  - path: infra/dev/docker-compose.deps.yml
  - path: infra/dev/docker-compose.api.yml
  - path: infra/dev/docker-compose.message-server.yml
