name: frontend-release

# ─────────────────────────────────────────────────────────────────────────────
# Build + push da imagem do frontend para o GHCR e deploy via SSH na VPS.
#
# As VITE_* são baked na imagem em build-time (abaixo) — por isso o frontend
# precisa de rebuild ao mudar domínio/URL pública.
#
# Secrets: EC2_HOST, EC2_USER, EC2_SSH_KEY, GHCR_TOKEN (se pacote privado)
# Variáveis (Variables):
#   VITE_API_BASE_URL       ex.: https://app.condosync.com.br/api/v1  (DNS)
#                           ex.: http://18.228.119.6/api/v1           (IP-only)
#   VITE_KEYCLOAK_URL       ex.: https://auth.condosync.com.br        (DNS)
#                           ex.: http://18.228.119.6/auth             (IP-only)
#   VITE_KEYCLOAK_REALM     (default: main)
#   VITE_KEYCLOAK_CLIENT_ID (default: main-frontend)
#   DEPLOY_PATH, EXTRA_COMPOSE_FILE (opcionais — ver backend-release.yml)
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
    tags: ['frontend-v*']
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-release.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag/SHA a publicar (default: SHA atual)'
        required: false

concurrency:
  group: frontend-release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      owner: ${{ steps.meta.outputs.owner }}
    steps:
      - uses: actions/checkout@v4

      - name: Definir tag e owner
        id: meta
        run: |
          TAG="${{ github.event.inputs.tag }}"
          [ -z "$TAG" ] && TAG="${GITHUB_SHA::12}"
          echo "image_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
            VITE_KEYCLOAK_URL=${{ vars.VITE_KEYCLOAK_URL }}
            VITE_KEYCLOAK_REALM=${{ vars.VITE_KEYCLOAK_REALM || 'main' }}
            VITE_KEYCLOAK_CLIENT_ID=${{ vars.VITE_KEYCLOAK_CLIENT_ID || 'main-frontend' }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/condosync-frontend:${{ steps.meta.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/condosync-frontend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Disparar deploy-frontend.sh na VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            export GHCR_OWNER="${{ needs.build-and-push.outputs.owner }}"
            export FRONTEND_TAG="${{ needs.build-and-push.outputs.image_tag }}"
            export GHCR_USER="${{ github.actor }}"
            export GHCR_TOKEN="${{ secrets.GHCR_TOKEN }}"
            export EXTRA_COMPOSE_FILE="${{ vars.EXTRA_COMPOSE_FILE }}"
            DEPLOY_PATH="${{ vars.DEPLOY_PATH }}"
            bash "${DEPLOY_PATH:-/opt/condosync}/infra/scripts/deploy-frontend.sh"
