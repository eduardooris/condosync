name: frontend-release

on:
  push:
    branches: [main]
    tags: ['frontend-v*']
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-release.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag/SHA a publicar (default: SHA atual)'
        required: false

concurrency:
  group: frontend-release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/condosync-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Definir tag da imagem
        id: meta
        run: |
          TAG="${{ github.event.inputs.tag }}"
          [ -z "$TAG" ] && TAG="${GITHUB_SHA::12}"
          echo "image_tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Repo Vars (Settings → Secrets and variables → Actions → Variables):
          #   VITE_PUBLIC_URL        ex: https://condosync.duckdns.org (preferido; = PUBLIC_URL do backend)
          #   VITE_API_BASE_URL      alias legado (mesmo valor, sem /api/v1)
          #   VITE_KEYCLOAK_URL      ex: http://18.228.119.6/auth     (IP-only)
          #                          ex: https://auth.condosync.com.br (DNS)
          #   VITE_KEYCLOAK_REALM    default: main
          #   VITE_KEYCLOAK_CLIENT_ID default: main-frontend
          build-args: |
            VITE_PUBLIC_URL=${{ vars.VITE_PUBLIC_URL || vars.VITE_API_BASE_URL }}
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
            VITE_KEYCLOAK_URL=${{ vars.VITE_KEYCLOAK_URL }}
            VITE_KEYCLOAK_REALM=${{ vars.VITE_KEYCLOAK_REALM }}
            VITE_KEYCLOAK_CLIENT_ID=${{ vars.VITE_KEYCLOAK_CLIENT_ID }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Disparar deploy-frontend.sh na VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: FRONTEND_TAG,GHCR_USER,GHCR_TOKEN,EXTRA_COMPOSE_FILE
          # Repo Var EXTRA_COMPOSE_FILE: defina como `docker-compose.ip-only.yml`
          # enquanto estiver em modo IP-only. Apague a var quando migrar pro DNS.
          script: |
            set -e
            export FRONTEND_TAG="${{ needs.build-and-push.outputs.image_tag }}"
            export GHCR_USER="${{ secrets.GHCR_USER }}"
            export GHCR_TOKEN="${{ secrets.GHCR_TOKEN }}"
            if [ -n "${{ vars.EXTRA_COMPOSE_FILE }}" ]; then
              export EXTRA_COMPOSE_FILE="${{ vars.EXTRA_COMPOSE_FILE }}"
            fi
            bash /opt/condosync/infra/scripts/deploy-frontend.sh
