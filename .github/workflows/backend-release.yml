name: backend-release

# ─────────────────────────────────────────────────────────────────────────────
# Pipeline de release isolada do backend.
#
# Trigger:
#   - push em `main` que toque em `backend/**`
#   - tag `backend-v*`
#   - manual (workflow_dispatch)
#
# Etapas:
#   1. build-and-push: builda a imagem com BuildKit e publica no GHCR com
#      duas tags (SHA + latest).
#   2. deploy: SSH na EC2 e dispara `deploy-api.sh` que faz pull + healthcheck
#      + rollback automático.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
    tags: ['backend-v*']
    paths:
      - 'backend/**'
      - '.github/workflows/backend-release.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag/SHA a publicar (default: SHA atual)'
        required: false

concurrency:
  group: backend-release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/condosync-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Definir tag da imagem
        id: meta
        run: |
          TAG="${{ github.event.inputs.tag }}"
          [ -z "$TAG" ] && TAG="${GITHUB_SHA::12}"
          echo "image_tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    # Só faz deploy automático em push para main; tags / dispatch precisam
    # ser promovidos manualmente.
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Disparar deploy-api.sh na EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE_TAG,GHCR_USER,GHCR_TOKEN,EXTRA_COMPOSE_FILE
          # Repo Var EXTRA_COMPOSE_FILE: defina como `docker-compose.ip-only.yml`
          # enquanto estiver em modo IP-only. Apague a var quando migrar pro DNS.
          script: |
            set -e
            export IMAGE_TAG="${{ needs.build-and-push.outputs.image_tag }}"
            export GHCR_USER="${{ secrets.GHCR_USER }}"
            export GHCR_TOKEN="${{ secrets.GHCR_TOKEN }}"
            export EXTRA_COMPOSE_FILE="${{ vars.EXTRA_COMPOSE_FILE }}"
            bash /opt/condosync/infra/scripts/deploy-api.sh
