<!doctype html>
<html lang="pt-BR">
  <head>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('condosync-ui');
          var t = 'dark';
          if (raw) {
            var p = JSON.parse(raw);
            if (p.state && (p.state.theme === 'light' || p.state.theme === 'dark')) t = p.state.theme;
          }
          document.documentElement.dataset.theme = t;
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', t === 'light' ? '#e8edf5' : '#06091a');
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="alternate icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=5, viewport-fit=cover"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#06091a" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#e8edf5" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="CondoSync — gestão condominial digital, transparente e simples." />
    <meta name="application-name" content="CondoSync" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CondoSync" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-TileColor" content="#06091a" />
    <title>CondoSync · Gestão condominial inteligente</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
